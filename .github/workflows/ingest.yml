name: Nightly CH ingest
on:
  schedule:
    - cron:  '0 0 * * *'   # 01:00 London (00:00 UTC)
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: python src/ch_ingest.py --days 1 --out data/raw