name: Feature build
on:
  workflow_dispatch: {}        # run by hand
  workflow_run:                # auto-trigger after ingest succeeds
    workflows: ["Nightly CH ingest"]
    types: [completed]
jobs:
  build_features:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install pandas pyarrow duckdb

      - name: Download raw parquet
        uses: actions/download-artifact@v4
        with:
          name: raw_companies          # ←  must match the name used in ingest.yml
          path: data/raw               # ←  exactly where feature_build.py expects it

      - name: Build feature dataset
        run: python src/feature_build.py

      - name: Upload features
        uses: actions/upload-artifact@v4
        with:
          name: features
          path: data/features/features.parquet
          retention-days: 7