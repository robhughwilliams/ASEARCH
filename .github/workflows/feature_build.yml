# .github/workflows/feature_build.yml
name: Feature build

on:
  workflow_run:
    workflows: ["Nightly CH ingest"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  build_features:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas pyarrow duckdb

      # Use dawidd6/action-download-artifact for cross-workflow artifact access
      - name: Download raw parquet from previous workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          name: raw_companies
          workflow: ingest.yml
          path: data/raw

      - name: Debug downloaded files
        run: |
          echo "Contents of data/raw:"
          ls -la data/raw/ || echo "data/raw doesn't exist"
          echo "All parquet files:"
          find . -name "*.parquet"
          echo "Current directory:"
          ls -la

      - name: Build feature dataset
        run: python src/feature_build.py

      - name: Upload features
        uses: actions/upload-artifact@v4
        with:
          name: features
          path: data/features/features.parquet
          retention-days: 7