# .github/workflows/feature_build.yml
name: Feature build

on:
  workflow_run:
    workflows: ["Nightly CH ingest"]  # ← This must match the Name: in ingest.yml exactly
    types: [completed]
  workflow_dispatch: {}               # ← Optional: allows manual runs if you uncomment

jobs:
  build_features:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read        # ←–– give the token access to artifacts from other runs
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas pyarrow duckdb

      - name: Download raw parquet
        uses: actions/download-artifact@v4
        with:
          name: raw_companies
          run-id: ${{ github.event.workflow_run.id }}
          path: data/raw

      - name: Build feature dataset
        run: python src/feature_build.py

      - name: Upload features
        uses: actions/upload-artifact@v4
        with:
          name: features
          path: data/features/features.parquet
          retention-days: 7